[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headful-auth-tunnel"
version = "0.4.6"
description = "LAN/VPN remote-control tunnel for human-operated headful browser sessions with persistent profiles."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "João Carreiro" }]
keywords = [
  "scrapling",
  "headful",
  "browser",
  "persistent-profile",
  "remote-control",
  "auth-tunnel",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = ["playwright>=1.48,<2", "scrapling[fetchers]>=0.4.8,<0.5"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/Jhacarreiro/headful-auth-tunnel"
Repository = "https://github.com/Jhacarreiro/headful-auth-tunnel"
Issues = "https://github.com/Jhacarreiro/headful-auth-tunnel/issues"

[project.scripts]
headful-auth-tunnel = "headful_auth_tunnel.server:main"

[tool.setuptools.packages.find]
include = ["headful_auth_tunnel*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"headful_auth_tunnel/ui.py" = ["E501"]
